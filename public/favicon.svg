<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Paper Plane Main Wings Gradient -->
    <linearGradient id="favPlaneGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="88%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Shadow Fold Gradient -->
    <linearGradient id="favShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Layers Gradient -->
    <linearGradient id="favLayersGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="50" cy="50" r="48" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />

  <!-- Stacked Layers at base -->
  <g transform="translate(38, 72) scale(0.65)">
    <path d="M -16 12 L 0 5 L 16 12 L 0 19 Z" fill="#F0FDFA" stroke="url(#favLayersGrad)" stroke-width="3" stroke-linejoin="round" />
    <path d="M -16 6 L 0 -1 L 16 6 L 0 13 Z" fill="#CCFBF1" stroke="url(#favLayersGrad)" stroke-width="3" stroke-linejoin="round" />
    <path d="M -16 0 L 0 -7 L 16 0 L 0 7 Z" fill="#99F6E4" stroke="url(#favLayersGrad)" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- Flying Paper Plane -->
  <g transform="translate(6, -2)">
    <!-- Underside shadow fold -->
    <path d="M 22 48 L 76 22 L 36 74 Z" fill="url(#favShadowGrad)" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Right Fold -->
    <path d="M 76 22 L 36 74 L 46 64 Z" fill="#9333EA" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Main Left Wing -->
    <path d="M 22 48 L 76 22 L 36 74 Z" fill="url(#favPlaneGrad)" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Center crease -->
    <path d="M 22 48 L 76 22" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
    <!-- Golden edge glow -->
    <path d="M 22 48 L 76 22 L 36 74 Z" fill="none" stroke="#FDE68A" stroke-width="1" opacity="0.8" />
  </g>
</svg>
